<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MATS Agent</title>
  <meta name="description" content="Bilingual voice agent for Hajj campaign operations, powered by NVIDIA Nemotron on Nebius Token Factory.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 7a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0v-5a4 4 0 0 1 4-4zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V26h-2v-3.1A7 7 0 0 1 9 16z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/static/img/shamsa.webp" fetchpriority="high">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#composerInput" data-i18n="skip">Skip to question box</a>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3a3.5 3.5 0 0 1 3.5 3.5v5a3.5 3.5 0 0 1-7 0v-5A3.5 3.5 0 0 1 12 3zM6 11.5h1.6a4.4 4.4 0 0 0 8.8 0H18a6 6 0 0 1-5.2 5.9V20h-1.6v-2.6A6 6 0 0 1 6 11.5z"/></svg>
      </span>
      <div>
        <h1>MATS Agent</h1>
        <p class="brand-sub" data-i18n="tagline">مساعد صوتي لعمليات حملات الحج</p>
      </div>
    </div>
    <nav class="top-actions" aria-label="Settings">
      <button class="icon-btn" id="speakBtn" aria-pressed="true" data-i18n-label="speakToggle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/><path class="off" d="M4 9v6h4l5 4V5L8 9H4zm11.6.6 1.4-1.4 2 2 2-2 1.4 1.4-2 2 2 2-1.4 1.4-2-2-2 2-1.4-1.4 2-2z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" data-i18n-label="theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9 9 0 0 0 12 3z"/></svg>
      </button>
      <button class="lang-btn" id="langBtn" data-i18n-label="switchLang"><span data-i18n="otherLang">English</span></button>
      <button class="icon-btn" id="runtimeBtn" data-i18n-label="runtime">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H4zM2 17h20v2H2zM6 7v6h12V7z" fill-rule="evenodd"/></svg>
      </button>
    </nav>
  </header>

  <main class="stage">
    <section class="voice" aria-labelledby="voiceTitle">
      <h2 id="voiceTitle" class="sr-only" data-i18n="voiceTitle">Voice</h2>
      <div class="mic-wrap">
        <span class="shamsa" aria-hidden="true"></span>
        <span class="ring" aria-hidden="true"></span>
        <span class="ring ring-2" aria-hidden="true"></span>
        <button id="micBtn" class="mic" aria-pressed="false" data-i18n-label="micLabel">
          <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3.5 3.5 0 0 1 3.5 3.5v5a3.5 3.5 0 0 1-7 0v-5A3.5 3.5 0 0 1 12 3zM6 11.5h1.6a4.4 4.4 0 0 0 8.8 0H18a6 6 0 0 1-5.2 5.9V20h-1.6v-2.6A6 6 0 0 1 6 11.5z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <div class="caption">
      <p id="status" class="status" role="status" aria-live="polite" data-i18n="statusIdle">اضغط وتكلّم</p>
      <p id="interim" class="interim" aria-live="polite"></p>
      <label class="switch">
        <input type="checkbox" id="handsFree">
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        <span data-i18n="handsFree">بدون يدين</span>
      </label>
      <p class="hint" data-i18n="handsFreeHint">يسمعك تلقائيًا بعد كل رد، وتقدر تقاطعه بصوتك.</p>
      </div>
    </section>

    <section class="chips" aria-labelledby="chipsTitle">
      <h2 id="chipsTitle" class="section-label"><span data-i18n="tryAsking">جرّب تسأل</span></h2>
      <div id="chipList" class="chip-list"></div>
    </section>

    <section id="thread" class="thread" aria-live="polite" aria-label="Conversation"></section>
  </main>

  <form id="composer" class="composer" autocomplete="off">
    <label for="composerInput" class="sr-only" data-i18n="inputLabel">Type your question</label>
    <input id="composerInput" type="text" dir="auto" data-i18n-ph="placeholder" placeholder="اكتب سؤالك…" enterkeyhint="send">
    <button id="sendBtn" type="submit" class="send" data-i18n-label="send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
    </button>
  </form>

  <dialog id="runtimeDlg" class="dlg" aria-labelledby="rtTitle">
    <div class="dlg-head">
      <h2 id="rtTitle" data-i18n="runtime">التشغيل</h2>
      <button class="icon-btn" id="rtClose" data-i18n-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </div>
    <div id="rtBody" class="rt-body"></div>
  </dialog>

  <template id="msgTpl">
    <article class="msg bot">
      <div class="answer" dir="auto"></div>
      <div class="meta"></div>
      <div class="sources" hidden></div>
      <details class="sql-box" hidden>
        <summary><span data-i18n="sql">SQL</span> <span class="sql-meta"></span></summary>
        <pre dir="ltr"><code></code></pre>
      </details>
      <div class="table-wrap" hidden></div>
      <div class="feedback" hidden>
        <span class="fb-q" data-i18n="fbQ">الجواب صحيح؟</span>
        <button type="button" class="fb right" data-v="right"><span data-i18n="right">صح</span></button>
        <button type="button" class="fb wrong" data-v="wrong"><span data-i18n="wrong">غلط</span></button>
        <span class="fb-msg" role="status"></span>
      </div>
      <details class="trace">
        <summary><span data-i18n="howAnswered">كيف جاوب</span> <span class="trace-total"></span></summary>
        <ol class="steps"></ol>
      </details>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
